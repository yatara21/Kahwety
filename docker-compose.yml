services:
  postgres:
    image: postgres:15-alpine
    container_name: kahwety-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kahwety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kahwety_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kahwety}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kahwety} -d $${POSTGRES_DB:-kahwety}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kahwety-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: kahwety-backend:local
    container_name: kahwety-migrations
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kahwety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kahwety_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kahwety}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-kahwety}:${POSTGRES_PASSWORD:-kahwety_secret_2026}@postgres:5432/${POSTGRES_DB:-kahwety}}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - kahwety-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kahwety-backend:local
    container_name: kahwety-backend
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kahwety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kahwety_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kahwety}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-kahwety}:${POSTGRES_PASSWORD:-kahwety_secret_2026}@postgres:5432/${POSTGRES_DB:-kahwety}}
      SECRET_KEY: ${SECRET_KEY:-super-secret-kahwety-development-key-change-in-production-64char}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://${ADMIN_DOMAIN:-admin.example.com}}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - kahwety-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: kahwety-frontend:local
    container_name: kahwety-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kahwety-network

  nginx:
    image: nginx:1.27-alpine
    container_name: kahwety-nginx
    profiles:
      - production
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.example.com}
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
      NGINX_ENVSUBST_FILTER: "$$ADMIN_DOMAIN $$API_DOMAIN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - kahwety-network

volumes:
  postgres_data:
    driver: local

networks:
  kahwety-network:
    driver: bridge
